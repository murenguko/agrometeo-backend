[project]
name = "weather-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.1.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "python-dotenv>=1.2.4",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
# Les tests garantissent le droit d'import du package `app` (moteur de conseils
# et configuration) et se terminent en mode asyncio pour les tests futurs.
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
